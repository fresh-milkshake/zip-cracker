[package]
name = "zip-cracker"
version = "1.1.0"
edition = "2021"
default-run = "zip-cracker"

[[bin]]
name = "zip-cracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17.3"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
num_cpus = "1.14.0"
rayon = "1.7.0"
zip = "0.6.3"
