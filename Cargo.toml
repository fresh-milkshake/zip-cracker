[package]
name = "zip-cracker"
version = "3.3.0"
edition = "2021"
default-run = "zip-cracker"

[[bin]]
name = "zip-cracker"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.6"
zip = { version = "2.6.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17.3"
num_cpus = "1.14.0"
crc32fast = "1.3"
tempfile = "3"
ctrlc = "3"
console = "0.15.11"
ureq = { version = "2.12.1", features = ["proxy-from-env"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
